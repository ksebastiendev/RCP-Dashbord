<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Icone de l'onglet. Le .ico porte les trois tailles que reclament les
      navigateurs de bureau, le .png de 32 px sert aux affichages a densite
      doublee, et l'icone Apple sert a l'ajout a l'ecran d'accueil.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#4d2409" />

    <title>BestCash Pay, back-office</title>
    <meta
      name="description"
      content="Back-office d'administration de la plateforme de paiement BestCash Pay."
    />
    <!-- Un back-office ne s'indexe pas. -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Pose la classe de theme avant le premier rendu. Sans cela, la page
      s'affiche en clair le temps que React demarre, puis bascule : un
      eclair blanc en pleine nuit.

      Le script lit la meme cle de stockage que le magasin de preferences,
      "bcp-preferences", et se rabat sur le reglage du systeme quand aucun
      choix n'a ete fait ou que le stockage est indisponible.
    -->
    <script>
      (function () {
        try {
          var brut = localStorage.getItem("bcp-preferences");
          var mode = brut ? JSON.parse(brut).state.theme : "systeme";
          var sombre =
            mode === "sombre" ||
            (mode !== "clair" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
          if (sombre) document.documentElement.classList.add("dark");
        } catch (e) {
          /* Stockage refuse ou contenu illisible : le theme clair sert de
             repli, et le magasin corrigera au premier rendu. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
